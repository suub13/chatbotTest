services:
  web:
    build: .
    container_name: chatbot_flask
    command: flask run --host=0.0.0.0
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      MYSQL_HOST: mysql_db
      MYSQL_USER: subyou
      MYSQL_PASSWORD: root
      MYSQL_DB: chatbot
    depends_on:
      - mysql_db

  mysql_db:
    image: mysql:8.0
    container_name: chatbot_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: chatbot
      MYSQL_USER: subyou
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
