<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>설문 chatbot Type 2</title>
    <link rel="stylesheet" type="text/css" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        .alert {
            display: none;
            background-color: #4CAF50;
            color: white;
            padding: 15px;
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            border-radius: 5px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
    <script>
        window.addEventListener('beforeunload', function() {
            resetSessionTimeout = setTimeout(() => {
                navigator.sendBeacon('/reset_session');
            }, 2000);  // Adjust the delay as necessary
        });
    </script>
    
</head>
<body>
   <header>
        <div id="loading-overlay" style="display: none;">
            <div class="spinner"></div>
            <div id="loading-message">로딩 중입니다... 잠시만 기다려 주세요.</div>
        </div>
       <!-- <h2 onclick="redirectWithUserId(2)" style="margin-left:20px;">민원 Chatbot</h2> -->
       <h2 style="margin-left:20px;">민원 Chatbot</h2>
       <div class="auth-buttons">
            {% if userid %}
            <p class="welcome-text">{{ userid }}</p>
            {% else %}
            <p class="welcome-text"> user id 없음</p>
            {% endif %}
       </div>
    </header>
    <div class="container" id="separateBody">
        <div id="chat-container">
            <div id="chat-box">
                <div id="chat-header">
                    <div id="chat-title">Type 2</div>
                    <button id="reload-button2" class="reload-button">↺</button>
                </div>
                <div id="messages2" class="messages"></div>
                <div id="input-container">
                    <textarea id="chat-input2" class="chat-input" placeholder="메시지를 입력하세요..."></textarea>
                    <button id="send-button2" class="send-button">▲</button>
                </div>
            </div>
            <div class="prompt-container">
                <div id="prompt-div">
                    <div class="prompt-title">Prompt 수정</div>
                    <div class="original-prompt">
                        You must also provide a link to the supporting legislation.<br>
                        All answers should be in Korean.</div>
                    <div style="font-size: 20px;">⇩</div>
                    <textarea id="prompt2" name="prompt" rows="10" cols="30"></textarea><br>
                    <button id="prompt-button2" class="prompt-button">수정하기</button>
                </div>
                <div id="response-message2"></div> <!-- 성공 메시지 표시할 공간 -->
            </div>
        </div>
    </div>
    <script src="../static/js/script.js"></script>
    <script>
        setupEventListeners(2);
        setupTextareaAdjustment(2);
    </script>
</body>
</html>
