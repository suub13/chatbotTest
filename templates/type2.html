<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>OCR & LLM</title>
    <link rel="stylesheet" type="text/css" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <script>
        window.addEventListener('beforeunload', function() {
            // 페이지를 떠나기 전에 세션 초기화를 위한 요청을 보냅니다.
            navigator.sendBeacon('/reset_session');
        });
        document.addEventListener('DOMContentLoaded', function() {
            const userid = "{{ userid }}";
            const typeNum = 2;  // Type 1 고정

            fetch('/create_agent', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    userid: userid,
                    typeNum: typeNum
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                } else {
                    console.log(data.message);
                    // 이후 작업 (예: 채팅 창 초기화 등)
                }
            })
            .catch(error => {
                console.error('Error creating chat agent:', error);
            });
        });
    </script>
    
</head>
<body>
   <header>
       <h2 onclick="window.location.href='/survey'" style="margin-left:20px;">민원 Chatbot</h2>
       <div class="auth-buttons">
            {% if userid %}
            <p class="welcome-text">{{ userid }}</p>
            {% else %}
            <p class="welcome-text"> user id 없음</p>
            {% endif %}
           <!-- {% if email %}
               <p class="welcome-text">{{ email }}</p>
               <button class="auth-link" onclick="window.location.href='/logout'">Logout</button>
           {% else %}
               <button class="auth-button" onclick="window.location.href='/login?action=login'">Login</button>
               <button class="auth-button" onclick="window.location.href='/login?action=register'">Register</button>
           {% endif %} -->
       </div>
    </header>
    <div class="container" id="separateBody">
        <div id="chat-container">
            <div id="chat-box">
                <div id="chat-header">
                    <div id="chat-title">Type 2</div>
                    <button id="reload-button2" class="reload-button">↺</button>
                </div>
                <div id="messages2" class="messages"></div>
                <div id="input-container">
                    <textarea id="chat-input2" class="chat-input" placeholder="메시지를 입력하세요..."></textarea>
                    <button id="send-button2" class="send-button">▲</button>
                </div>
            </div>
        </div>
    </div>
    <script src="../static/script.js"></script>
    <script>
        setupEventListeners(2);
        setupTextareaAdjustment(2);
    </script>
</body>
</html>
