<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>OCR & LLM</title>
    <link rel="stylesheet" type="text/css" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        .alert {
            display: none;
            background-color: #4CAF50;
            color: white;
            padding: 15px;
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            border-radius: 5px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
    <script>
        window.addEventListener('beforeunload', function() {
            resetSessionTimeout = setTimeout(() => {
                navigator.sendBeacon('/reset_session');
            }, 100);  // Adjust the delay as necessary
        });
        document.addEventListener('DOMContentLoaded', function() {
            const userid = "{{ userid }}";
            const typeNum = 1;  // Type 1 고정

            fetch('/create_agent', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    userid: userid,
                    typeNum: typeNum
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                } else {
                    console.log(data.message);
                    // 이후 작업 (예: 채팅 창 초기화 등)
                }
            })
            .catch(error => {
                console.error('Error creating chat agent:', error);
            });
        });
    </script>
    
</head>
<body>
   <header>
       <h2 onclick="window.location.href='/survey'" style="margin-left:20px;">민원 Chatbot</h2>
       <div class="auth-buttons">
            {% if userid %}
            <p class="welcome-text">{{ userid }}</p>
            {% else %}
            <p class="welcome-text"> user id 없음</p>
            {% endif %}
       </div>
    </header>
    <div class="container" id="separateBody">
        <div id="chat-container">
            <div id="chat-box">
                <div id="chat-header">
                    <div id="chat-title">Type 1</div>
                    <button id="reload-button1" class="reload-button">↺</button>
                </div>
                <div id="messages1" class="messages"></div>
                <div id="input-container">
                    <textarea id="chat-input1" class="chat-input" placeholder="메시지를 입력하세요..."></textarea>
                    <button id="send-button1" class="send-button">▲</button>
                </div>
            </div>
            <div class="template-container">
                <div id="template-div">
                    <div class="template_title">Template 수정</div>
                    <div class="original-template">You must answer in a narrative, one-line format. <br>
                        All answers should be in Korean.</div>
                    <div style="font-size: 20px;">⇩</div>
                    <textarea id="template1" name="template" rows="10" cols="30"></textarea><br>
                    <button id="template-button1" class="template-button">수정하기</button>
                </div>
                <div id="response-message1"></div> <!-- 성공 메시지 표시할 공간 -->
            </div>
        </div>
    </div>
    <script src="../static/script.js"></script>
    <script>
        setupEventListeners(1);
        setupTextareaAdjustment(1);
    </script>
</body>
</html>
